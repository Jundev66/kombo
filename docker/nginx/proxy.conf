# Cabeceras para hablar con un servidor de desarrollo de Vite.
#
# Esto vive en un fichero aparte y se incluye en CADA `location` que hace
# proxy_pass, y no una sola vez arriba, por una razón concreta de nginx: en
# cuanto un `location` declara UNA sola directiva `proxy_set_header`, pierde
# TODAS las heredadas del bloque de arriba. No avisa.
#
# El síntoma cuando falta es desconcertante: Vite recibe `Host: vite_panel`
# —el nombre del upstream— y responde "Blocked request. This host is not
# allowed", que parece un problema de configuración de Vite y no lo es.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# El recambio en caliente de Vite viaja por websocket.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_http_version 1.1;

proxy_read_timeout 3600s;
