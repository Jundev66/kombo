name: CI

# Present since the first commit, on purpose.
#
# Architecture tests only protect if somebody runs them, and "somebody
# remembers" is not a mechanism. These run themselves or they are no use.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First and separate: it needs neither a database nor dependencies, so a
  # stale index is reported in twenty seconds rather than after five minutes
  # of test suite.
  registro:
    name: Registro · códigos e índice
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: El registro de trabajos está al día
        run: ./scripts/trabajos.sh verificar

  backend:
    name: Backend · Pest y estilo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kombo_owner
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: kombo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kombo_owner -d kombo"
          --health-interval 3s --health-timeout 3s --health-retries 20

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v5

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip, pcntl
          coverage: none
          ini-values: date.timezone=America/Caracas

      - name: Crear los dos usuarios de base de datos
        # kombo_app WITHOUT BYPASSRLS. It is what makes the isolation tests test
        # something: running as the owner they would pass green even with RLS
        # completely broken.
        env:
          PGPASSWORD: secret
          PGHOST: localhost
          POSTGRES_USER: kombo_owner
          POSTGRES_DB: kombo
        run: bash docker/postgres/init/01-roles.sh

      - name: Caché de dependencias
        uses: actions/cache@v5
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      - name: Instalar dependencias
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1

      - name: Migrar (como dueño del esquema) las dos bases
        working-directory: api
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: |
          php artisan migrate --database=pgsql_owner --force
          DB_DATABASE=kombo_test php artisan migrate --database=pgsql_owner --force

      - name: Los límites del diseño
        working-directory: api
        env: { DB_HOST: 127.0.0.1, REDIS_HOST: 127.0.0.1 }
        run: ./vendor/bin/pest --group=arch

      - name: El aislamiento entre negocios
        working-directory: api
        env: { DB_HOST: 127.0.0.1, REDIS_HOST: 127.0.0.1 }
        run: ./vendor/bin/pest --group=isolation

      - name: Toda la suite
        working-directory: api
        env: { DB_HOST: 127.0.0.1, REDIS_HOST: 127.0.0.1 }
        run: ./vendor/bin/pest

      - name: Estilo
        working-directory: api
        run: ./vendor/bin/pint --test

  frontend:
    name: Frontend · tipos y presupuesto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Tipos
        working-directory: web
        run: npm run typecheck

      - name: Construir
        working-directory: web
        run: npm run build

      - name: Presupuesto de arranque
        # Breaks if an app goes over. A product requirement: every extra 100 KB is
        # seconds of blank screen on the shop's PC.
        working-directory: web
        run: npm run size

  e2e:
    name: Pruebas de usuario
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Levantar el entorno completo
        # The same steps as `make setup`. `api/vendor` is not in the repository
        # and the image does not carry it — the code is bind-mounted — so
        # without the install artisan has no autoloader.
        run: |
          docker compose up -d --build
          docker compose exec -T api composer install --no-interaction --prefer-dist --no-progress
          docker compose exec -T api cp -n .env.example .env || true
          docker compose exec -T api php artisan key:generate
          docker compose exec -T api php artisan storage:link
          docker compose exec -T api php artisan migrate --database=pgsql_owner --force

      # The runner is slower than a development machine. Without this the suite
      # begins against an API that is not answering yet, and every test fails
      # for a reason that has nothing to do with what it checks.
      #
      # `/up` and not `/api/v1/me`: the seeding happens inside `run.sh`, one
      # step below, so at this point no tenant exists yet and the resolver
      # answers 404 — correctly, and for five minutes.
      - name: Esperar a que la API responda
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: admin.localhost' http://localhost:8010/up || true)
            if [ "$code" = "200" ]; then echo "La API responde."; exit 0; fi
            sleep 5
          done
          echo "La API no respondió en cinco minutos. Devolvió: $code"
          exit 1

      - name: Correr
        run: ./e2e/run.sh

      # A CI that fails without saying why is the failure it was meant to catch.
      - name: Qué dicen los contenedores
        if: failure()
        run: |
          docker compose ps
          echo '── api ──'   && docker compose logs --tail=120 api
          echo '── nginx ──' && docker compose logs --tail=60 nginx
          echo '── colas ──' && docker compose logs --tail=40 queue

      - name: Guardar el informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright
          path: |
            e2e/reports/
            e2e/results/
          retention-days: 7
