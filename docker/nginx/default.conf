# Docker's own DNS, and every address behind a VARIABLE.
#
# An `upstream` block resolves its name ONCE, when the configuration loads, and
# never again. The day compose recreates `api` — which it does on its own, when
# `docker compose run` finds a dependency out of date — the container comes back
# on a NEW address and nginx keeps dialling the old one. Worse: the freed
# address goes to whatever container starts next, so the symptom is not a
# timeout but «Connection refused» from something that was never listening. 502
# on everything until somebody restarts nginx. KMB-0012.
#
# A name inside a VARIABLE is resolved per request, through `resolver`. `valid=`
# is not decoration: Docker's DNS answers with a ten-minute TTL, longer than the
# whole test suite. `ipv6=off` because the network is IPv4 and the AAAA lookup
# only adds ways to fail.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $host $php            { default "api:9000"; }
map $host $vite_portal    { default "portal:5173"; }
map $host $vite_pos       { default "pos:5173"; }
map $host $vite_dashboard { default "dashboard:5173"; }
map $host $vite_kds       { default "kds:5173"; }
map $host $vite_admin     { default "admin:5173"; }

# ─────────────────────────────────────────────────────────────────────────────
# Platform administration: admin.localhost
#
# It comes FIRST and with an exact name because nginx resolves literal
# server_names before regular-expression ones. That way `admin` is never read
# as the subdomain of a tenant called "admin" — and for the same reason
# `admin` is on the resolver's reserved slug list.
#
# No tenant header is passed here: this dashboard is cross-tenant, and its
# tenant context does not exist.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.localhost;
    client_max_body_size 32M;

    # `webhooks` goes here rather than under /api because it is an address
    # pasted once into Meta's console and never changed: versioning it would
    # force every customer to reconfigure the day there is a v2.
    location ~ ^/(api|sanctum|storage|up|webhooks) {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /var/www/api/public;
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_read_timeout 60s;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$vite_admin;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# One tenant per subdomain: elsazon.localhost, laesquina.localhost, …
#
# The named-group regular expression is a real WILDCARD: any present or
# future tenant resolves without touching this file, without DNS and without
# certificates. The local equivalent of production's wildcard DNS, and why
# signing a customer up costs one row in `tenants`.
#
# The four apps sit under the SAME ORIGIN on purpose: the browser isolates
# localStorage and IndexedDB by origin, so one tenant's till cannot read what
# another's stored, with nobody writing a line to prevent it.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name ~^(?<tenant>[a-z0-9][a-z0-9-]*)\.localhost$ localhost;
    client_max_body_size 32M;

    # `webhooks` goes here rather than under /api because it is an address
    # pasted once into Meta's console and never changed: versioning it would
    # force every customer to reconfigure the day there is a v2.
    location ~ ^/(api|sanctum|storage|up|webhooks) {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /var/www/api/public;
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        # The subdomain, already extracted. The application infers it from the Host
        # anyway — so it works with `artisan serve` too — but having it here makes it
        # appear in the logs with nothing to parse.
        fastcgi_param HTTP_X_KOMBO_TENANT $tenant;
        fastcgi_read_timeout 60s;
    }

    location /pos/   { include /etc/nginx/snippets/proxy.conf; proxy_pass http://$vite_pos; }
    location = /pos   { return 301 /pos/; }

    location /kds/ { include /etc/nginx/snippets/proxy.conf; proxy_pass http://$vite_kds; }
    location = /kds    { return 301 /kds/; }

    location /dashboard/  { include /etc/nginx/snippets/proxy.conf; proxy_pass http://$vite_dashboard; }
    location = /dashboard { return 301 /dashboard/; }

    # The root is the customer portal: what somebody arriving from a WhatsApp
    # link sees, with nothing to type after the domain.
    location /        { include /etc/nginx/snippets/proxy.conf; proxy_pass http://$vite_portal; }
}
