name: CI

# Existe desde el primer commit a propósito.
#
# Unas pruebas de arquitectura sólo protegen si alguien las corre, y "alguien
# se acuerda" no es un mecanismo. Éstas se corren solas o no sirven de nada.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primero y aparte: no necesita ni base de datos ni dependencias, así que un
  # índice sin regenerar se dice en veinte segundos y no después de cinco
  # minutos de suite.
  registro:
    name: Registro · códigos e índice
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: El registro de trabajos está al día
        run: ./scripts/trabajos.sh verificar

  backend:
    name: Backend · Pest y estilo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kombo_owner
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: kombo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kombo_owner -d kombo"
          --health-interval 3s --health-timeout 3s --health-retries 20

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v5

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip, pcntl
          coverage: none
          ini-values: date.timezone=America/Caracas

      - name: Crear los dos usuarios de base de datos
        # kombo_app SIN BYPASSRLS. Es lo que hace que las pruebas de
        # aislamiento prueben algo: corriendo como el dueño pasarían en verde
        # incluso con RLS completamente roto.
        env:
          PGPASSWORD: secret
        run: psql -h localhost -U kombo_owner -d kombo -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles.sql

      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      - name: Instalar dependencias
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1

      - name: Migrar (como dueño del esquema) las dos bases
        working-directory: api
        env:
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: |
          php artisan migrate --database=pgsql_owner --force
          DB_DATABASE=kombo_test php artisan migrate --database=pgsql_owner --force

      - name: Los límites del diseño
        working-directory: api
        env: { DB_HOST: 127.0.0.1, REDIS_HOST: 127.0.0.1 }
        run: ./vendor/bin/pest --group=arch

      - name: El aislamiento entre negocios
        working-directory: api
        env: { DB_HOST: 127.0.0.1, REDIS_HOST: 127.0.0.1 }
        run: ./vendor/bin/pest --group=isolation

      - name: Toda la suite
        working-directory: api
        env: { DB_HOST: 127.0.0.1, REDIS_HOST: 127.0.0.1 }
        run: ./vendor/bin/pest

      - name: Estilo
        working-directory: api
        run: ./vendor/bin/pint --test

  frontend:
    name: Frontend · tipos y presupuesto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Tipos
        working-directory: web
        run: npm run typecheck

      - name: Construir
        working-directory: web
        run: npm run build

      - name: Presupuesto de arranque
        # Rompe si una aplicación se pasa. Es requisito de producto: cada
        # 100 KB de más son segundos de pantalla en blanco en la PC del local.
        working-directory: web
        run: npm run size

  e2e:
    name: Pruebas de usuario
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Levantar el entorno completo
        run: |
          docker compose up -d --build
          docker compose exec -T api cp -n .env.example .env || true
          docker compose exec -T api php artisan key:generate
          docker compose exec -T api php artisan migrate --database=pgsql_owner --force

      - name: Correr
        run: ./e2e/run.sh

      - name: Guardar el informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            e2e/reportes/
            e2e/resultados/
          retention-days: 7
