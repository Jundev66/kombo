# nginx en producción.
#
# La misma estructura que en desarrollo —un bloque exacto para `admin.` y un
# comodín para los negocios— con tres diferencias:
#
#   1. Las aplicaciones se sirven como ARCHIVOS, no proxeadas a Vite.
#   2. Hay TLS, con el certificado de origen de Cloudflare.
#   3. Se recupera la IP real del cliente de la cabecera de Cloudflare.
#
# El punto 3 no es cosmético: los limitadores de intentos de la aplicación
# cuentan por IP. Sin esto, todos los clientes comparten la IP de Cloudflare y
# el primero que se equivoque de contraseña deja fuera a los demás.
#
# Este fichero se monta como PLANTILLA (`/etc/nginx/templates/`): al arrancar,
# el contenedor sustituye `${KOMBO_ROOT_DOMAIN}` y `${KOMBO_ADMIN_HOST}` por lo
# que haya en el entorno. Sólo se sustituyen nombres que existen como variables
# de entorno, así que `$uri`, `$host` y `$tenant` llegan intactos.

upstream php { server api:9000; }

# ── La IP real ──────────────────────────────────────────────────────────────
#
# Sólo se acepta de rangos de Cloudflare. Confiar en `CF-Connecting-IP` viniendo
# de cualquiera dejaría que un cliente se inventara su propia IP y se saltara
# todos los límites escribiendo una cabecera.
#
# Actualizar con:  curl https://www.cloudflare.com/ips-v4
include /etc/nginx/snippets/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Los assets con hash en el nombre no cambian nunca: un año de caché. El
# `index.html` sí cambia en cada despliegue, y servirlo de una caché vieja es
# cómo un cliente sigue viendo la aplicación de la semana pasada.
map $uri $cache_control {
    default                       "no-cache";
    ~*/assets/                    "public, max-age=31536000, immutable";
    ~*\.(svg|png|jpg|webp|woff2)$ "public, max-age=2592000";
}

server {
    listen 80 default_server;
    server_name _;

    # Cloudflare ya redirige, pero si alguien apunta directo al servidor por IP
    # no puede acabar hablando en claro.
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# La super administración. Bloque EXACTO y primero: `admin` es un slug
# reservado, y no puede caer nunca en el comodín de los negocios.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${KOMBO_ADMIN_HOST};

    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;

    include /etc/nginx/snippets/seguridad.conf;
    client_max_body_size 32M;

    location ~ ^/(api|sanctum|up|webhooks) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    location / {
        root /srv/admin;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /index.html;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Un negocio por subdominio.
#
# Comodín de verdad: dar de alta un cliente sigue costando una fila en
# `tenants`. Sin tocar nginx, sin DNS y sin certificados nuevos — que es
# exactamente lo que compra el comodín de Cloudflare.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ~^(?<tenant>[a-z0-9][a-z0-9-]*)\.${KOMBO_ROOT_DOMAIN}$;

    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;

    include /etc/nginx/snippets/seguridad.conf;
    client_max_body_size 32M;

    # Las fotos de los productos, servidas por nginx.
    #
    # `^~` y no una expresión regular a propósito: sin él ganaría el bloque de
    # abajo, `/storage/...` acabaría en PHP y Laravel devolvería 404 para un
    # archivo que existe. En desarrollo esto funciona por el enlace que crea
    # `storage:link`; aquí nginx no tiene el código de la API, sólo el volumen.
    #
    # Los comprobantes de pago NO se sirven de aquí: viven en `private/` y salen
    # por un controlador que comprueba el permiso `payments.confirm`.
    location ^~ /storage/ {
        alias /var/www/api/storage/app/public/;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri =404;
    }

    # `webhooks` fuera de `/api` a propósito: es una dirección que se pega una
    # vez en la consola de Meta y no cambia nunca.
    location ~ ^/(api|sanctum|up|webhooks) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTP_X_KOMBO_TENANT $tenant;
        # Que Laravel sepa que la petición llegó cifrada: el TLS lo terminó
        # nginx, y sin esto genera enlaces `http` que el navegador rechaza.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    # Las cuatro aplicaciones, bajo el MISMO ORIGEN a propósito: el navegador
    # aísla el almacenamiento por origen, así que la caja de un negocio no puede
    # leer lo que guardó la de otro sin que nadie escriba una línea.
    location /caja/ {
        alias /srv/caja/;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /caja/index.html;
    }
    location = /caja { return 301 /caja/; }

    location /cocina/ {
        alias /srv/cocina/;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /cocina/index.html;
    }
    location = /cocina { return 301 /cocina/; }

    location /panel/ {
        alias /srv/panel/;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /panel/index.html;
    }
    location = /panel { return 301 /panel/; }

    # La raíz es el portal: es lo que ve quien llega por un enlace de WhatsApp,
    # y no debe tener que escribir nada después del dominio.
    location / {
        root /srv/portal;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /index.html;
    }
}
