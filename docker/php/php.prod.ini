; PHP en producción.
;
; Mismo criterio que en desarrollo —esto corre en máquinas modestas— pero sin
; las concesiones que sólo tienen sentido mientras se escribe código.

memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 60

date.timezone = America/Caracas

; El error NUNCA se le enseña al usuario: lo recoge el manejador de excepciones
; de Laravel y va al registro. Un volcado de PHP en la pantalla de un cliente
; enseña rutas, versiones y a veces credenciales.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Opcache ────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; **La diferencia que más rinde**: en desarrollo PHP comprueba en cada petición
; si cada fichero cambió. Aquí no cambia ninguno —el código va dentro de la
; imagen— así que comprobarlo es gastar entradas y salidas de disco para
; confirmar siempre lo mismo. Al desplegar se construye una imagen nueva, que es
; lo que invalida la caché.
opcache.validate_timestamps = 0

opcache.jit = tracing
opcache.jit_buffer_size = 64M
