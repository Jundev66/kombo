# The ranges `CF-Connecting-IP` is accepted from.
#
# Without this list, anybody could send that header and impersonate whatever
# IP they liked — bypassing every attempt limiter with one line of curl. That
# is why `real_ip_header` applies only to what comes from here.
#
# Cloudflare changes them very occasionally. To update:
#
#   curl -s https://www.cloudflare.com/ips-v4 | sed 's/^/set_real_ip_from /; s/$/;/'
#   curl -s https://www.cloudflare.com/ips-v6 | sed 's/^/set_real_ip_from /; s/$/;/'

