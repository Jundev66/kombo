; PHP configuration for Kombo.
;
; Everything below targets modest hardware — a 4 GB shop PC, a small VPS — not
; benchmark numbers.

memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 60

; The tenant's timezone. Without it every date computed in PHP comes out in UTC
; and ticket times land four hours off.
date.timezone = America/Caracas

; Development shows the error; in production Laravel's exception handler covers
; it and these are overridden by environment variable.
display_errors = On
error_reporting = E_ALL

; ── Opcache ────────────────────────────────────────────────────────────────
; The biggest win on a slow machine: not recompiling the same PHP every request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps=1 with revalidate_freq=0 makes a code change visible
; without restarting anything. Production sets it to 0 and recompiles on deploy.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Tracing JIT. Little help on plain HTTP requests — the database is the
; bottleneck — but it pays off in the queue jobs that compute reports.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ── Realpath cache ─────────────────────────────────────────────────────────
; With thousands of vendor files, resolving filesystem paths is a measurable
; slice of boot time.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ── Precision ──────────────────────────────────────────────────────────────
; -1 uses the correct float serialisation algorithm. It deliberately matters
; little here: ids are UUIDs and money is integer cents, never a float.
serialize_precision = -1
