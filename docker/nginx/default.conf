upstream php         { server api:9000; }
upstream vite_portal { server portal:5173; }
upstream vite_caja   { server caja:5173; }
upstream vite_panel  { server panel:5173; }
upstream vite_kds    { server kds:5173; }
upstream vite_admin  { server admin:5173; }

# ─────────────────────────────────────────────────────────────────────────────
# La super administración: admin.localhost
#
# Va PRIMERO y con nombre exacto porque nginx resuelve los server_name
# literales antes que los de expresión regular. Así `admin` nunca se
# interpreta como el subdominio de un negocio llamado "admin" — y por eso
# mismo `admin` está en la lista de slugs reservados del resolutor.
#
# Aquí no se pasa la cabecera de negocio: este panel es cross-tenant, y su
# contexto de negocio no existe.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.localhost;
    client_max_body_size 32M;

    location ~ ^/(api|sanctum|storage|up) {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /var/www/api/public;
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_read_timeout 60s;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://vite_admin;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Un negocio por subdominio: elsazon.localhost, laesquina.localhost, …
#
# La expresión regular con grupo nombrado es un COMODÍN de verdad: cualquier
# negocio presente o futuro entra sin tocar este fichero, sin DNS y sin
# certificados. Es el equivalente local del DNS comodín de producción, y la
# razón por la que dar de alta un cliente cuesta una fila en `tenants`.
#
# Las cuatro aplicaciones van bajo el MISMO ORIGEN a propósito: el navegador
# aísla localStorage e IndexedDB por origen, así que la caja de un negocio no
# puede leer lo que guardó la de otro sin que nadie escriba una línea para
# impedirlo.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name ~^(?<tenant>[a-z0-9][a-z0-9-]*)\.localhost$ localhost;
    client_max_body_size 32M;

    location ~ ^/(api|sanctum|storage|up) {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /var/www/api/public;
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        # El subdominio ya extraído. La aplicación igual lo deduce del Host
        # —así funciona también con `artisan serve`, sin nginx delante—, pero
        # tenerlo aquí hace que aparezca en los logs sin parsear nada.
        fastcgi_param HTTP_X_KOMBO_TENANT $tenant;
        fastcgi_read_timeout 60s;
    }

    location /caja/   { include /etc/nginx/snippets/proxy.conf; proxy_pass http://vite_caja; }
    location = /caja  { return 301 /caja/; }

    location /cocina/ { include /etc/nginx/snippets/proxy.conf; proxy_pass http://vite_kds; }
    location = /cocina { return 301 /cocina/; }

    location /panel/  { include /etc/nginx/snippets/proxy.conf; proxy_pass http://vite_panel; }
    location = /panel { return 301 /panel/; }

    # La raíz es el portal del cliente final: es lo que ve quien llega por el
    # link de WhatsApp, y no debe tener que escribir nada después del dominio.
    location /        { include /etc/nginx/snippets/proxy.conf; proxy_pass http://vite_portal; }
}
