name: kombo

# Ports chosen not to clash with the other projects on this machine. All
# three can be up at once.
#
#   http://elsazon.localhost:8010/            customer portal
#   http://elsazon.localhost:8010/dashboard/  owner dashboard
#   http://elsazon.localhost:8010/pos/        counter till
#   http://elsazon.localhost:8010/kds/        kitchen screen
#   http://admin.localhost:8010/              platform administration

x-php: &php
  build:
    context: ./docker/php
  working_dir: /var/www/api
  volumes:
    - ./api:/var/www/api
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: kombo
    DB_USERNAME: kombo_app
    DB_PASSWORD: secret
    # Migrations only: `artisan migrate --database=pgsql_owner`.
    DB_OWNER_USERNAME: kombo_owner
    DB_OWNER_PASSWORD: secret
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

# The five Vite dev servers share everything but which workspace they start.
# node_modules goes in a VOLUME rather than the host bind on purpose: Rollup,
# esbuild and Tailwind's engine ship per-platform binaries, and node_modules
# installed on macOS do not start inside a Linux container.
x-vite: &vite
  image: node:24-alpine
  working_dir: /app
  volumes:
    - ./web:/app
    - web-node-modules:/app/node_modules
  depends_on:
    web-install:
      condition: service_completed_successfully

services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - '8010:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - ./api:/var/www/api:ro
    depends_on: [api, portal, pos, dashboard, kds, admin]

  api:
    <<: *php

  # One worker: on a modest machine, four competing for two cores make
  # EVERYTHING slow, including the request the cashier is waiting for. It goes
  # up when there is something to measure it with.
  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=90 --max-jobs=500
    restart: unless-stopped

  # Here since day one even with nothing to schedule yet. Remembering the
  # scheduler on deployment day is the classic bug: expiry warnings simply do
  # not go out and nobody notices.
  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: kombo_owner
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kombo
    volumes:
      # On PostgreSQL 18+ the mount goes at /var/lib/postgresql, NOT
      # /var/lib/postgresql/data: the image places data in a per-major-version
      # subdirectory, which is what allows `pg_upgrade --link` without crossing
      # the mount boundary. With the old mount the container starts and stops with
      # a long error explaining exactly this.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kombo_owner -d kombo']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '6382:6379'
    # No persistence: only cache, sessions, queues and the bot's conversational
    # state live here. Nothing painful to lose, and writing to disk shows on a
    # slow machine.
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Installs once, before any Vite starts. If all five installed on startup,
  # they would write to the same volume at the same time.
  web-install:
    image: node:24-alpine
    working_dir: /app
    command: npm install --no-audit --no-fund
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

  portal: { <<: *vite, command: npm run dev --workspace=@kombo/portal }
  pos:   { <<: *vite, command: npm run dev --workspace=@kombo/pos }
  dashboard:  { <<: *vite, command: npm run dev --workspace=@kombo/dashboard }
  kds:    { <<: *vite, command: npm run dev --workspace=@kombo/kds }
  admin:  { <<: *vite, command: npm run dev --workspace=@kombo/admin }

  # ── End-to-end tests ───────────────────────────────────────────────────────
  # In their own profile so `docker compose up -d` does not start them. The
  # image tag MUST match the version pinned in e2e/package.json; a mismatch
  # shows up as a protocol failure mid-test, which looks like flakiness and is
  # not.
  e2e-install:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /e2e
    command: npm install --no-audit --no-fund
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    profiles: ['test']

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      # Inside the network nginx is reached directly, with no published port.
      E2E_PORT: '80'
      # A wildcard, like nginx's server_name: a new tenant does not touch this
      # line. Listing tenants here would be listing customers.
      E2E_RESOLVER: 'nginx:80'
    # Without this Chromium runs out of shared memory and the failure looks like
    # system flakiness.
    ipc: host
    depends_on:
      e2e-install:
        condition: service_completed_successfully
      nginx:
        condition: service_started
    profiles: ['test']

volumes:
  postgres-data:
  web-node-modules:
  e2e-node-modules:
