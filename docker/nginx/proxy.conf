# Headers for talking to a Vite dev server.
#
# This lives in its own file and is included in EVERY `location` that
# proxy_passes, rather than once at the top, for a concrete nginx reason: the
# moment a `location` declares a single `proxy_set_header`, it loses ALL those
# inherited from the block above. Silently.
#
# The symptom when it is missing is baffling: Vite receives
# `Host: vite_dashboard` — the upstream's name — and answers "Blocked request.
# This host is not allowed", which looks like a Vite misconfiguration and is not.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Vite's hot module replacement travels over a websocket.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_http_version 1.1;

proxy_read_timeout 3600s;
