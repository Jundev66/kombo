name: kombo

# El entorno de PRODUCCIÓN.
#
#   docker compose -f compose.prod.yml up -d --build
#
# Tres diferencias de fondo con `compose.yml`:
#
#   1. El código va DENTRO de las imágenes, no montado desde el disco. Se
#      construye una vez y se despliega tal cual.
#   2. No hay servidores de Vite: las cinco aplicaciones son archivos estáticos.
#   3. Nada de contraseñas escritas aquí. Todo sale de un `.env` que no está en
#      el repositorio.
#
# Los pasos completos, desde un servidor vacío, están en `docs/despliegue.md`.

x-api: &api
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  restart: unless-stopped
  volumes:
    # Lo único que sobrevive a un despliegue: los comprobantes de pago y las
    # fotos de los productos. Si esto fuera parte de la imagen, cada
    # actualización borraría los archivos de todos los clientes.
    - api-storage:/var/www/api/storage/app
    # Los respaldos, en su propio volumen. Aparte del anterior a propósito: el
    # respaldo empaqueta `storage/app`, así que guardarlos ahí haría que cada
    # copia contuviera a la anterior.
    #
    #   docker compose -f compose.prod.yml cp api:/var/www/api/storage/respaldos ./
    - backups:/var/www/api/storage/respaldos
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY:?falta APP_KEY — genérala con «php artisan key:generate --show»}
    APP_URL: https://${KOMBO_ADMIN_HOST}

    KOMBO_ROOT_DOMAIN: ${KOMBO_ROOT_DOMAIN:?falta el dominio raíz}
    KOMBO_ADMIN_HOST: ${KOMBO_ADMIN_HOST:?falta el host de administración}
    KOMBO_PUBLIC_URL: https://{slug}.${KOMBO_ROOT_DOMAIN}
    # Apagado, y esto importa: encendido, `demo:limpiar` cerraría pedidos de
    # clientes reales y el seeder crearía una cuenta de administración con una
    # contraseña conocida.
    KOMBO_DEMO_TOOLS: 'false'

    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-kombo}
    DB_USERNAME: kombo_app
    DB_PASSWORD: ${KOMBO_APP_PASSWORD:?falta la contraseña de kombo_app}
    DB_OWNER_USERNAME: kombo_owner
    DB_OWNER_PASSWORD: ${KOMBO_OWNER_PASSWORD:?falta la contraseña de kombo_owner}

    REDIS_HOST: redis
    REDIS_PORT: 6379

    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: 'true'
    # VACÍO a propósito. Poner `.tudominio` compartiría la cookie de sesión
    # entre todos los negocios y entre ellos y la administración: el aislamiento
    # por origen se apoya en que la cookie sea de un solo host.
    SESSION_DOMAIN: ''
    SANCTUM_STATEFUL_DOMAINS: ${KOMBO_ROOT_DOMAIN},*.${KOMBO_ROOT_DOMAIN},${KOMBO_ADMIN_HOST}

    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    AUTH_GUARD: sanctum
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}

    # Los respaldos. Sin esto el respaldo se hace igual, pero sólo en disco —
    # y un respaldo que vive en la misma máquina no sirve el día que se pierde
    # la máquina.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    AWS_BUCKET: ${AWS_BUCKET:-}
    AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    AWS_USE_PATH_STYLE_ENDPOINT: 'true'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      KOMBO_ROOT_DOMAIN: ${KOMBO_ROOT_DOMAIN:?falta el dominio raíz}
      KOMBO_ADMIN_HOST: ${KOMBO_ADMIN_HOST:?falta el host de administración}
    volumes:
      # `templates/` es la vía de nginx para sustituir variables al arrancar:
      # así el dominio del cliente no está escrito dentro de la imagen.
      - ./docker/nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/seguridad.conf:/etc/nginx/snippets/seguridad.conf:ro
      - ./docker/nginx/cloudflare-ips.conf:/etc/nginx/snippets/cloudflare-ips.conf:ro
      # El certificado de origen de Cloudflare. Ver `docs/despliegue.md`.
      - ./certs:/etc/nginx/certs:ro
      # Los estáticos de las cinco aplicaciones y el `public/` de la API, que es
      # de donde salen las fotos subidas.
      - web-assets:/srv:ro
      - api-storage:/var/www/api/storage/app:ro
    depends_on:
      api:
        condition: service_started
      # nginx no arranca hasta que las aplicaciones están publicadas: si lo
      # hiciera antes, el primero que entrara vería un 404 en la raíz.
      web:
        condition: service_completed_successfully

  api:
    <<: *api
    # php-fpm es el único que migra: tres contenedores arrancando a la vez y
    # migrando en paralelo es cómo se rompe una base en un despliegue.
    command: php-fpm

  queue:
    <<: *api
    command: php artisan queue:work --tries=3 --timeout=90 --max-jobs=500

  scheduler:
    <<: *api
    command: php artisan schedule:work

  # Compila las cinco aplicaciones, las copia al volumen que lee nginx y
  # termina. No atiende peticiones: existe para publicar esa carpeta, y en cada
  # despliegue la vuelve a publicar (ver `docker/web/Dockerfile`).
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: 'no'
    volumes:
      - web-assets:/srv

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kombo}
      POSTGRES_USER: kombo_owner
      POSTGRES_PASSWORD: ${KOMBO_OWNER_PASSWORD:?falta la contraseña de kombo_owner}
      # La lee el script de inicialización para crear el usuario de la
      # aplicación —el que SÍ está sujeto a RLS—.
      KOMBO_APP_PASSWORD: ${KOMBO_APP_PASSWORD:?falta la contraseña de kombo_app}
      # Vacía: en el servidor de un cliente no se crea base de pruebas. En
      # desarrollo, sin esta variable, el mismo script crea `kombo_test`.
      KOMBO_TEST_DATABASE: ''
    volumes:
      # PostgreSQL 18 monta en `/var/lib/postgresql`, no en `.../data`: la
      # imagen coloca los datos en un subdirectorio por versión mayor para que
      # `pg_upgrade --link` funcione sin cruzar el punto de montaje.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kombo_owner -d ${DB_DATABASE:-kombo}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Sin persistencia: aquí sólo viven caché, sesiones, colas y el estado del
    # bot. Escribir en disco se nota en una máquina modesta y no hay nada que
    # duela perder — como mucho, alguien vuelve a entrar.
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru

volumes:
  postgres-data:
  api-storage:
  web-assets:
  backups:
