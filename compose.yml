name: kombo

# Puertos elegidos para no chocar con los otros proyectos de esta máquina
# (foodRun usa 8000/5435/6381, Krono usa 5432/6379). Los tres pueden estar
# levantados a la vez.
#
#   http://elsazon.localhost:8010/          portal del cliente
#   http://elsazon.localhost:8010/panel/    panel del dueño
#   http://elsazon.localhost:8010/caja/     caja
#   http://elsazon.localhost:8010/cocina/   pantalla de cocina
#   http://admin.localhost:8010/            super administración

x-php: &php
  build:
    context: ./docker/php
  working_dir: /var/www/api
  volumes:
    - ./api:/var/www/api
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: kombo
    DB_USERNAME: kombo_app
    DB_PASSWORD: secret
    # Solo para migraciones: `artisan migrate --database=pgsql_owner`.
    DB_OWNER_USERNAME: kombo_owner
    DB_OWNER_PASSWORD: secret
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

# Los cinco servidores de desarrollo de Vite comparten todo menos qué workspace
# arrancan. node_modules va en un VOLUMEN y no en el bind del host a propósito:
# Rollup, esbuild y el motor de Tailwind traen binarios por plataforma, y unos
# node_modules instalados en macOS no arrancan dentro de un contenedor Linux.
x-vite: &vite
  image: node:24-alpine
  working_dir: /app
  volumes:
    - ./web:/app
    - web-node-modules:/app/node_modules
  depends_on:
    web-install:
      condition: service_completed_successfully

services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - '8010:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - ./api:/var/www/api:ro
    depends_on: [api, portal, caja, panel, kds, admin]

  api:
    <<: *php

  # Un solo worker: en una máquina modesta, cuatro workers compitiendo por dos
  # núcleos hacen que TODO vaya lento, incluida la petición que el cajero está
  # esperando. Se sube cuando haya con qué medirlo.
  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=90 --max-jobs=500
    restart: unless-stopped

  # Está desde el primer día aunque todavía no haya nada que planificar.
  # Acordarse del planificador el día del despliegue es el bug clásico: los
  # avisos de vencimiento sencillamente no salen y nadie se entera.
  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: kombo_owner
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kombo
    volumes:
      # En PostgreSQL 18+ el montaje va en /var/lib/postgresql, NO en
      # /var/lib/postgresql/data: la imagen coloca los datos en un
      # subdirectorio por versión mayor, que es lo que permite hacer
      # `pg_upgrade --link` sin cruzar el límite del punto de montaje.
      # Con el montaje antiguo el contenedor arranca y se para con un error
      # largo explicando justo esto.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kombo_owner -d kombo']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '6382:6379'
    # Sin persistencia: aquí solo viven caché, sesiones, colas y el estado
    # conversacional del bot. Nada que duela perder, y escribir en disco en una
    # máquina lenta se nota.
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Instala una sola vez, antes de que arranque ningún Vite. Si los cinco
  # instalaran al arrancar, escribirían sobre el mismo volumen a la vez.
  web-install:
    image: node:24-alpine
    working_dir: /app
    command: npm install --no-audit --no-fund
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

  portal: { <<: *vite, command: npm run dev --workspace=@kombo/portal }
  caja:   { <<: *vite, command: npm run dev --workspace=@kombo/caja }
  panel:  { <<: *vite, command: npm run dev --workspace=@kombo/panel }
  kds:    { <<: *vite, command: npm run dev --workspace=@kombo/kds }
  admin:  { <<: *vite, command: npm run dev --workspace=@kombo/admin }

  # ── Pruebas de usuario ─────────────────────────────────────────────────────
  # En su propio perfil para que `docker compose up -d` no los levante.
  # La etiqueta de la imagen DEBE coincidir con la versión fijada en
  # e2e/package.json; una diferencia se manifiesta como un fallo de protocolo a
  # mitad de prueba, que parece intermitencia y no lo es.
  e2e-install:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /e2e
    command: npm install --no-audit --no-fund
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    profiles: ['test']

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      # Dentro de la red se habla con nginx directo, sin publicar puerto.
      E2E_PORT: '80'
      # Comodín, igual que el server_name de nginx: un negocio nuevo no toca
      # esta línea. Enumerar negocios aquí sería enumerar clientes.
      E2E_RESOLVER: 'nginx:80'
    # Sin esto Chromium se queda sin memoria compartida y el fallo parece
    # intermitencia del sistema.
    ipc: host
    depends_on:
      e2e-install:
        condition: service_completed_successfully
      nginx:
        condition: service_started
    profiles: ['test']

volumes:
  postgres-data:
  web-node-modules:
  e2e-node-modules:
