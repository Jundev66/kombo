name: kombo

# The PRODUCTION environment.
#
#   docker compose -f compose.prod.yml up -d --build
#
# Three underlying differences from `compose.yml`:
#
#   1. The code lives INSIDE the images, not mounted from disk. Built once and
#      deployed as is.
#   2. There are no Vite servers: the five apps are static files.
#   3. No passwords written here. Everything comes from a `.env` that is not
#      in the repository.
#
# The full steps, from an empty server, are in `docs/despliegue.md`.

x-api: &api
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  restart: unless-stopped
  volumes:
    # The only thing that survives a deployment: payment receipts and product
    # photos. Were this part of the image, every update would delete every
    # customer's files.
    - api-storage:/var/www/api/storage/app
    # The backups, on their own volume. Deliberately apart from the one above:
    # the backup packs `storage/app`, so keeping them there would make each copy
    # contain the previous one.
    #
    #   docker compose -f compose.prod.yml cp api:/var/www/api/storage/backups ./
    - backups:/var/www/api/storage/backups
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY:?falta APP_KEY — genérala con «php artisan key:generate --show»}
    APP_URL: https://${KOMBO_ADMIN_HOST}

    KOMBO_ROOT_DOMAIN: ${KOMBO_ROOT_DOMAIN:?falta el dominio raíz}
    KOMBO_ADMIN_HOST: ${KOMBO_ADMIN_HOST:?falta el host de administración}
    KOMBO_PUBLIC_URL: https://{slug}.${KOMBO_ROOT_DOMAIN}
    # Off, and this matters: on, `demo:clean` would close real customers' orders
    # and the seeder would create an administration account with a known
    # password.
    KOMBO_DEMO_TOOLS: 'false'

    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-kombo}
    DB_USERNAME: kombo_app
    DB_PASSWORD: ${KOMBO_APP_PASSWORD:?falta la contraseña de kombo_app}
    DB_OWNER_USERNAME: kombo_owner
    DB_OWNER_PASSWORD: ${KOMBO_OWNER_PASSWORD:?falta la contraseña de kombo_owner}

    REDIS_HOST: redis
    REDIS_PORT: 6379

    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: 'true'
    # Deliberately EMPTY. Setting `.yourdomain` would share the session cookie
    # across every tenant and with administration: origin isolation rests on the
    # cookie belonging to one host.
    SESSION_DOMAIN: ''
    SANCTUM_STATEFUL_DOMAINS: ${KOMBO_ROOT_DOMAIN},*.${KOMBO_ROOT_DOMAIN},${KOMBO_ADMIN_HOST}

    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    AUTH_GUARD: sanctum
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}

    # The backups. Without this the backup still runs, but only to disk — and a
    # backup living on the same machine is no use the day the machine is lost.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    AWS_BUCKET: ${AWS_BUCKET:-}
    AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    AWS_USE_PATH_STYLE_ENDPOINT: 'true'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      KOMBO_ROOT_DOMAIN: ${KOMBO_ROOT_DOMAIN:?falta el dominio raíz}
      KOMBO_ADMIN_HOST: ${KOMBO_ADMIN_HOST:?falta el host de administración}
    volumes:
      # `templates/` is nginx's way of substituting variables at startup, so the
      # customer's domain is not baked into the image.
      - ./docker/nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/seguridad.conf:/etc/nginx/snippets/seguridad.conf:ro
      - ./docker/nginx/cloudflare-ips.conf:/etc/nginx/snippets/cloudflare-ips.conf:ro
      # Cloudflare's origin certificate. See `docs/despliegue.md`.
      - ./certs:/etc/nginx/certs:ro
      # The five apps' static files and the API's `public/`, which is where
      # uploaded photos come from.
      - web-assets:/srv:ro
      - api-storage:/var/www/api/storage/app:ro
    depends_on:
      api:
        condition: service_started
      # nginx does not start until the apps are published: otherwise the first
      # visitor would see a 404 at the root.
      web:
        condition: service_completed_successfully

  api:
    <<: *api
    # php-fpm is the only one that migrates: three containers starting at once
    # and migrating in parallel is how a database breaks during a deployment.
    command: php-fpm

  queue:
    <<: *api
    command: php artisan queue:work --tries=3 --timeout=90 --max-jobs=500

  scheduler:
    <<: *api
    command: php artisan schedule:work

  # Builds the five apps, copies them to the volume nginx reads, and exits. It
  # serves no requests: it exists to publish that directory, and republishes it
  # on every deployment (see `docker/web/Dockerfile`).
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: 'no'
    volumes:
      - web-assets:/srv

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kombo}
      POSTGRES_USER: kombo_owner
      POSTGRES_PASSWORD: ${KOMBO_OWNER_PASSWORD:?falta la contraseña de kombo_owner}
      # Read by the init script to create the application user — the one that IS
      # subject to RLS.
      KOMBO_APP_PASSWORD: ${KOMBO_APP_PASSWORD:?falta la contraseña de kombo_app}
      # Empty: no test database is created on a customer's server. In development,
      # without this variable, the same script creates `kombo_test`.
      KOMBO_TEST_DATABASE: ''
    volumes:
      # PostgreSQL 18 mounts at `/var/lib/postgresql`, not `.../data`: the image
      # places data in a per-major-version subdirectory so `pg_upgrade --link`
      # works without crossing the mount point.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kombo_owner -d ${DB_DATABASE:-kombo}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # No persistence: only cache, sessions, queues and the bot's state live here.
    # Writing to disk shows on a modest machine and there is nothing painful to
    # lose — at worst somebody signs in again.
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru

volumes:
  postgres-data:
  api-storage:
  web-assets:
  backups:
