# Cabeceras que no cuestan nada y cierran puertas conocidas.
#
# Sólo `add_header`, y eso importa: en nginx, un `location` que declara UNA
# cabecera pierde TODAS las heredadas del bloque de arriba, sin avisar. Como los
# bloques de estáticos tienen que declarar su propio `Cache-Control`, este
# fichero se incluye TAMBIÉN dentro de cada uno de ellos — que es justo donde
# más falta hacen, porque son los que devuelven HTML.
#
# No hay `Content-Security-Policy` aquí, y es a propósito: una CSP escrita a
# ciegas rompe la aplicación en producción y no en desarrollo, que es la peor
# forma de descubrirla. Va cuando se pueda probar de verdad, con su propia
# vuelta de comprobaciones.

# El navegador no adivina el tipo de un archivo. Sin esto, una imagen subida por
# un cliente que en realidad es HTML puede ejecutarse como página.
add_header X-Content-Type-Options "nosniff" always;

# Nadie mete el portal de un negocio dentro de un iframe suyo.
add_header X-Frame-Options "SAMEORIGIN" always;

# Al salir hacia otro sitio no se filtra la ruta completa — que en el
# seguimiento de un pedido lleva el token dentro.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Un año de HTTPS obligatorio. `preload` NO se pone: es prácticamente
# irreversible, y meter un dominio en la lista de los navegadores es una
# decisión que se toma cuando ya no queda nada sirviéndose en claro.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
