; PHP in production.
;
; Same reasoning as development — this runs on modest machines — without the
; concessions that only make sense while code is being written.

memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 60

date.timezone = America/Caracas

; The error is NEVER shown to the user: Laravel's exception handler picks it up
; and it goes to the log. A PHP dump on a customer's screen leaks paths,
; versions and sometimes credentials.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Opcache ────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The setting that pays off most: in development PHP checks every file on every
; request. Here nothing changes — the code lives inside the image — so checking
; spends disk I/O to confirm the same thing every time. A deploy builds a new
; image, and that is what invalidates the cache.
opcache.validate_timestamps = 0

opcache.jit = tracing
opcache.jit_buffer_size = 64M
