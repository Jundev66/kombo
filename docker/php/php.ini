; Configuración de PHP para Kombo.
;
; El criterio de fondo: esto corre en máquinas modestas —una PC de local con
; 4 GB, un VPS pequeño—. Cada ajuste de abajo está para que el sistema responda
; en ese hardware, no para que luzca bien en un benchmark.

memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
max_execution_time = 60

; Zona horaria del negocio. Sin esto, cualquier fecha calculada en PHP sale en
; UTC y las horas de las comandas quedan corridas cuatro horas.
date.timezone = America/Caracas

; En desarrollo queremos ver el error; en producción lo tapa el manejador de
; excepciones de Laravel y esto se sobrescribe por variable de entorno.
display_errors = On
error_reporting = E_ALL

; ── Opcache ────────────────────────────────────────────────────────────────
; Lo que más rinde en una máquina lenta: no volver a compilar el mismo PHP en
; cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps=1 con revalidate_freq=0 hace que un cambio en el código
; se vea sin reiniciar nada. En producción se pone en 0 por variable de
; entorno y se recompila en el despliegue: ahí es donde se gana el último 15 %.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; JIT en modo tracing. Ayuda poco en peticiones HTTP normales —el cuello es la
; base de datos— pero sí en los trabajos de cola que calculan reportes.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; ── Caché de rutas ─────────────────────────────────────────────────────────
; Con miles de ficheros de vendor, resolver rutas del sistema de archivos es
; una porción medible del tiempo de arranque.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ── Precisión ──────────────────────────────────────────────────────────────
; -1 usa el algoritmo correcto para serializar flotantes. Aquí importa poco a
; propósito: los identificadores son UUID y el dinero son enteros de centavos,
; nunca float. Si algún día un importe llega como float, es un error, no un
; detalle de configuración.
serialize_precision = -1
