# Headers that cost nothing and close known doors.
#
# Only `add_header`, and that matters: in nginx, a `location` that declares
# ONE header loses ALL those inherited from the block above, silently. Since
# the static blocks have to declare their own `Cache-Control`, this file is
# ALSO included inside each of them — which is exactly where they are needed
# most, because those are the ones returning HTML.
#
# There is no `Content-Security-Policy` here, on purpose: a CSP written blind
# breaks the app in production and not in development, which is the worst way
# to discover it. It goes in when it can be tested properly, with its own
# round of checks.

# The browser does not guess a file's type. Without this, a customer-uploaded
# image that is really HTML could execute as a page.
add_header X-Content-Type-Options "nosniff" always;

# Nobody puts a tenant's portal inside an iframe of theirs.
add_header X-Frame-Options "SAMEORIGIN" always;

# Leaving for another site does not leak the full path — which on an order's
# tracking screen carries the token inside.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# A year of enforced HTTPS. `preload` is deliberately NOT set: it is
# practically irreversible, and putting a domain on the browsers' list is a
# decision taken when nothing is served in the clear any more.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
