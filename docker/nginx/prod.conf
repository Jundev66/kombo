# nginx in production.
#
# The same structure as development — an exact block for `admin.` and a
# wildcard for the tenants — with three differences:
#
#   1. The apps are served as FILES, not proxied to Vite.
#   2. There is TLS, with Cloudflare's origin certificate.
#   3. The client's real IP is recovered from Cloudflare's header.
#
# Point 3 is not cosmetic: the application's attempt limiters count per IP.
# Without it, every customer shares Cloudflare's IP and the first to mistype a
# password locks everyone else out.
#
# This file is mounted as a TEMPLATE (`/etc/nginx/templates/`): at startup the
# container substitutes `${KOMBO_ROOT_DOMAIN}` and `${KOMBO_ADMIN_HOST}` from
# the environment. Only names that exist as environment variables are
# substituted, so `$uri`, `$host`, `$tenant` and `$php` arrive intact.

# Docker's own DNS, and the API's address behind a VARIABLE.
#
# An `upstream` block resolves its name once, when the configuration loads, and
# never again: the deployment that recreates `api` gives it a new address and
# nginx keeps dialling the old one — 502 across the whole site, every tenant,
# until somebody restarts nginx by hand. In a variable the name is resolved per
# request. `valid=` overrides the TTL, which Docker's DNS sets to ten minutes.
# KMB-0012.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $host $php { default "api:9000"; }

# ── The real IP ─────────────────────────────────────────────────────────────
#
# Accepted only from Cloudflare ranges. Trusting `CF-Connecting-IP` from
# anyone would let a client invent their own IP and bypass every limit by
# writing a header.
#
# Update with:  curl https://www.cloudflare.com/ips-v4
include /etc/nginx/snippets/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Hash-named assets never change: a year of caching. `index.html` does change
# on every deployment, and serving it from a stale cache is how a customer
# keeps seeing last week's app.
map $uri $cache_control {
    default                       "no-cache";
    ~*/assets/                    "public, max-age=31536000, immutable";
    ~*\.(svg|png|jpg|webp|woff2)$ "public, max-age=2592000";
}

server {
    listen 80 default_server;
    server_name _;

    # Cloudflare already redirects, but somebody pointing straight at the server
    # by IP must not end up speaking in the clear.
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# Platform administration. An EXACT block, and first: `admin` is a reserved
# slug and must never fall into the tenants' wildcard.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${KOMBO_ADMIN_HOST};

    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;

    include /etc/nginx/snippets/security.conf;
    client_max_body_size 32M;

    location ~ ^/(api|sanctum|up|webhooks) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    location / {
        root /srv/admin;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /index.html;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# One tenant per subdomain.
#
# A real wildcard: signing a customer up still costs one row in `tenants`.
# No nginx change, no DNS and no new certificates — exactly what
# Cloudflare's wildcard buys.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    server_name ~^(?<tenant>[a-z0-9][a-z0-9-]*)\.${KOMBO_ROOT_DOMAIN}$;

    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;

    include /etc/nginx/snippets/security.conf;
    client_max_body_size 32M;

    # The product photos, served by nginx.
    #
    # `^~` rather than a regular expression on purpose: without it the block
    # below would win, `/storage/...` would end up in PHP, and Laravel would
    # return 404 for a file that exists. In development this works through the
    # `storage:link` symlink; here nginx has no API code, only the volume.
    #
    # Payment receipts are NOT served from here: they live in `private/` and come
    # out through a controller that checks the `payments.confirm` permission.
    location ^~ /storage/ {
        alias /var/www/api/storage/app/public/;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri =404;
    }

    # `webhooks` outside `/api` on purpose: an address pasted once into Meta's
    # console that never changes.
    location ~ ^/(api|sanctum|up|webhooks) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTP_X_KOMBO_TENANT $tenant;
        # So Laravel knows the request arrived encrypted: nginx terminated TLS, and
        # without this it generates `http` links the browser rejects.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    # The four apps, under the SAME ORIGIN on purpose: the browser isolates
    # storage by origin, so one tenant's till cannot read what another's stored,
    # with nobody writing a line.
    location /pos/ {
        alias /srv/pos/;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /pos/index.html;
    }
    location = /pos { return 301 /pos/; }

    location /kds/ {
        alias /srv/kds/;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /kds/index.html;
    }
    location = /kds { return 301 /kds/; }

    location /dashboard/ {
        alias /srv/dashboard/;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /dashboard/index.html;
    }
    location = /dashboard { return 301 /dashboard/; }

    # The root is the portal: what somebody arriving from a WhatsApp link sees,
    # with nothing to type after the domain.
    location / {
        root /srv/portal;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control $cache_control always;
        try_files $uri /index.html;
    }
}
